<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Đồ Ăn Vặt Monbay - PISA</title>

<style>
*{box-sizing:border-box;font-family:'Segoe UI',Tahoma,Verdana,sans-serif}
body{margin:0;padding:20px;background:#3a4a9f;min-height:100vh}
.container{max-width:500px;margin:auto;background:#fff;border-radius:20px;padding:30px;box-shadow:0 10px 40px rgba(0,0,0,.3)}
.app-title{background:linear-gradient(135deg,#3a4a9f,#2d3a7a);color:#fff;text-align:center;padding:15px;border-radius:15px;margin-bottom:25px}
.emoji{font-size:28px}
h1{margin:5px 0 0;font-size:22px}
label{font-weight:600;color:#3a4a9f;display:block;margin-bottom:6px}
.form-group{margin-bottom:18px}
input,select{width:100%;padding:12px;border-radius:10px;border:2px solid #ddd;font-size:15px}
input:focus,select:focus{outline:none;border-color:#f06292}

/* loading */
.select-loading{
  background:linear-gradient(90deg,#f0f0f0 25%,#e0e0e0 50%,#f0f0f0 75%);
  background-size:200% 100%;
  animation:shimmer 1.5s infinite;
}
@keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}

.radio-group{display:flex;gap:15px;margin-bottom:20px}
.radio-option{flex:1;padding:15px;border-radius:10px;border:2px solid #ddd;text-align:center;cursor:pointer;font-weight:600;color:#3a4a9f}
.radio-option.selected{background:#f06292;color:#fff;border-color:#f06292}

.btn{width:100%;padding:15px;border:none;border-radius:10px;background:linear-gradient(135deg,#f06292,#e91e63);color:#fff;font-size:17px;font-weight:600;cursor:pointer;margin-top:10px}
.btn-add{background:linear-gradient(135deg,#4CAF50,#388E3C)}
.btn:disabled{background:#ccc;cursor:not-allowed}

.hidden{display:none}
.message{padding:15px;border-radius:10px;margin-bottom:15px;text-align:center;font-weight:600}
.success{background:#d4edda;color:#155724}
.error{background:#f8d7da;color:#721c24}

.mon-item{border:2px solid #ddd;border-radius:12px;padding:15px;margin-bottom:15px;background:#f9f9f9}
.mon-item-header{display:flex;justify-content:space-between;align-items:center}
.btn-remove{background:#ff5252;color:#fff;border:none;width:28px;height:28px;border-radius:50%;cursor:pointer}
.so-luong-wrapper{display:flex;gap:10px}

.footer{text-align:center;margin-top:25px;font-size:12px;color:#777}

.loading{
  display:inline-block;width:14px;height:14px;border:2px solid #ccc;
  border-top-color:#e91e63;border-radius:50%;
  animation:spin .8s linear infinite;margin-right:6px
}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>

<body>
<div class="container">
  <div class="app-title">
    <div class="emoji">🍜🍦🥖</div>
    <h1>Đồ Ăn Vặt Monbay</h1>
  </div>

  <div id="message" class="message hidden"></div>

  <!-- STEP 1 -->
  <label>Bạn là:</label>
  <div class="radio-group">
    <div class="radio-option" onclick="chonLoai('hocsinh',this)">🎒 Học sinh</div>
    <div class="radio-option" onclick="chonLoai('giaovien',this)">👨‍🏫 GV/NV</div>
  </div>

  <!-- STEP 2: HỌC SINH -->
  <div id="formHocSinh" class="hidden">
    <div class="form-group">
      <label>Chọn lớp</label>
      <select id="selectLop" onchange="loadHocSinh()"></select>
    </div>

    <div id="nhapLopTuDo" class="form-group hidden">
      <label>Nhập lớp</label>
      <input id="inputLopHS">
    </div>

    <div id="chonTenWrapper" class="form-group hidden">
      <label>Chọn tên</label>
      <select id="selectTen" onchange="chonTen()"></select>
    </div>

    <div id="nhapTenTuDo" class="form-group hidden">
      <label>Nhập tên</label>
      <input id="inputTenHS">
    </div>
  </div>

  <!-- STEP 2: GV -->
  <div id="formGiaoVien" class="hidden">
    <div class="form-group">
      <label>Nhập tên</label>
      <input id="inputTenGV">
    </div>
  </div>

  <!-- STEP 3 -->
  <div id="formMon" class="hidden">
    <div id="monList">
      <div class="mon-item">
        <div class="mon-item-header"><strong>🍽️ Món 1</strong></div>
        <input class="input-mon" placeholder="Tên món">
        <div class="so-luong-wrapper">
          <select class="select-so-luong" onchange="toggleSoLuongKhac(this)">
            <option>1</option><option>2</option><option>3</option>
            <option>4</option><option>5</option>
            <option value="khac">Khác</option>
          </select>
          <input type="number" class="input-so-luong-khac hidden" min="1">
        </div>
      </div>
    </div>

    <button class="btn btn-add" onclick="themMon()">➕ Thêm món</button>
    <button class="btn" onclick="datHang()">🛒 Đặt hàng</button>
  </div>

  <div class="footer">Sản phẩm của Tổ AI & Tech</div>
</div>

<script>
/* ✅ API MONBAY */
const API_URL='https://script.google.com/macros/s/AKfycbwKlDUuD12eGnieHU28xcO55oiS5NspMaq0UR2iD6Ko0fuC0keecnMnHW5DDYDtMsq9/exec';

let loaiNguoiDung='',selectedLop='',selectedMaHV='',selectedHoTen='';
let danhSachHS=[],monCount=1,cacheDanhSachLop=null,cacheHocSinhTheoLop={};

function chonLoai(loai,el){
  loaiNguoiDung=loai;
  document.querySelectorAll('.radio-option').forEach(e=>e.classList.remove('selected'));
  el.classList.add('selected');

  formMon.classList.add('hidden');
  formHocSinh.classList.toggle('hidden',loai!=='hocsinh');
  formGiaoVien.classList.toggle('hidden',loai!=='giaovien');

  if(loai==='hocsinh') loadDanhSachLop();
  else formMon.classList.remove('hidden');
}

async function loadDanhSachLop(){
  const s=selectLop;
  if(cacheDanhSachLop) return renderLop(cacheDanhSachLop);
  s.classList.add('select-loading');
  s.innerHTML='<option>⏳ Đang tải...</option>';
  const r=await fetch(API_URL+'?action=getListLop');
  const d=await r.json();
  cacheDanhSachLop=d;
  renderLop(d);
}

function renderLop(d){
  selectLop.classList.remove('select-loading');
  selectLop.innerHTML='<option value="">-- Chọn lớp --</option>';
  d.forEach(l=>selectLop.innerHTML+=`<option>${l}</option>`);
  selectLop.innerHTML+='<option value="khongcolop">❌ Không có lớp</option>';
}

async function loadHocSinh(){
  const lop=selectLop.value;
  formMon.classList.add('hidden');
  nhapLopTuDo.classList.add('hidden');
  nhapTenTuDo.classList.add('hidden');
  chonTenWrapper.classList.add('hidden');

  if(!lop) return;
  if(lop==='khongcolop'){
    nhapLopTuDo.classList.remove('hidden');
    nhapTenTuDo.classList.remove('hidden');
    formMon.classList.remove('hidden');
    return;
  }

  selectedLop=lop;
  chonTenWrapper.classList.remove('hidden');

  if(cacheHocSinhTheoLop[lop]) return renderHS(cacheHocSinhTheoLop[lop]);

  selectTen.classList.add('select-loading');
  selectTen.innerHTML='<option>⏳ Đang tải...</option>';
  const r=await fetch(API_URL+'?action=getHocSinhTheoLop&lop='+encodeURIComponent(lop));
  const d=await r.json();
  cacheHocSinhTheoLop[lop]=d;
  renderHS(d);
}

function renderHS(d){
  selectTen.classList.remove('select-loading');
  danhSachHS=d;
  selectTen.innerHTML='<option value="">-- Chọn tên --</option>';
  d.forEach((hs,i)=>selectTen.innerHTML+=`<option value="${i}">${hs.hoTen}</option>`);
  selectTen.innerHTML+='<option value="khongco">❌ Không có tên</option>';
}

function chonTen(){
  const v=selectTen.value;
  if(!v){formMon.classList.add('hidden');return}
  if(v==='khongco'){
    nhapTenTuDo.classList.remove('hidden');
    formMon.classList.remove('hidden');
    selectedMaHV='';selectedHoTen='';
    return;
  }
  const hs=danhSachHS[v];
  selectedMaHV=hs.maHV;
  selectedHoTen=hs.hoTen;
  nhapTenTuDo.classList.add('hidden');
  formMon.classList.remove('hidden');
}

function toggleSoLuongKhac(sel){
  sel.nextElementSibling.classList.toggle('hidden',sel.value!=='khac');
}

function themMon(){
  monCount++;
  monList.insertAdjacentHTML('beforeend',`
  <div class="mon-item">
    <div class="mon-item-header">
      <strong>🍽️ Món ${monCount}</strong>
      <button class="btn-remove" onclick="this.parentElement.parentElement.remove()">✕</button>
    </div>
    <input class="input-mon" placeholder="Tên món">
    <div class="so-luong-wrapper">
      <select class="select-so-luong" onchange="toggleSoLuongKhac(this)">
        <option>1</option><option>2</option><option>3</option>
        <option>4</option><option>5</option>
        <option value="khac">Khác</option>
      </select>
      <input type="number" class="input-so-luong-khac hidden" min="1">
    </div>
  </div>`);
}

function layDanhSachMon(){
  return [...document.querySelectorAll('.mon-item')].map(m=>{
    const ten=m.querySelector('.input-mon').value.trim();
    let sl=m.querySelector('.select-so-luong').value;
    if(sl==='khac') sl=m.querySelector('.input-so-luong-khac').value;
    return ten&&sl?{mon:ten,soLuong:+sl}:null;
  }).filter(Boolean);
}

async function datHang(){
  const ds=layDanhSachMon();
  if(!ds.length) return showMsg('Vui lòng nhập món!','error');

  const payload={
    lop:selectedLop,
    maHV:selectedMaHV,
    hoTen:selectedHoTen||inputTenGV.value||inputTenHS.value,
    danhSachMon:ds
  };

  const btn=document.querySelector('.btn:not(.btn-add)');
  btn.disabled=true;
  btn.innerHTML='<span class="loading"></span> Đang gửi';

  try{
    const r=await fetch(API_URL,{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify(payload)});
    const j=await r.json();
    showMsg(j.message,j.success?'success':'error');
  }catch{
    showMsg('Lỗi kết nối!','error');
  }

  btn.disabled=false;
  btn.innerHTML='🛒 Đặt hàng';
}

function showMsg(t,type){
  message.textContent=t;
  message.className='message '+type;
  message.classList.remove('hidden');
  setTimeout(()=>message.classList.add('hidden'),5000);
}
</script>
</body>
</html>
